<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <div id="note" hidden></div>
    <main id="font" hidden>
      <header>
        <div class="title-row">
          <h1 id="family" class="sample"></h1>
          <select id="face" aria-label="Font in the collection" hidden></select>
        </div>
        <div id="style"></div>
        <dl id="facts"></dl>
      </header>

      <section>
        <div class="controls">
          <input id="sample-input" type="text" spellcheck="false" aria-label="Sample text" />
          <input id="size" type="range" min="8" max="240" value="64" aria-label="Sample size" />
          <span id="size-label">64 px</span>
        </div>
        <div id="big" class="sample"></div>
      </section>

      <section>
        <h2>Sizes</h2>
        <div id="sizes"></div>
      </section>

      <section>
        <h2>Letters and digits</h2>
        <div id="lines"></div>
      </section>

      <section>
        <h2>Characters</h2>
        <p id="glyph-note" hidden></p>
        <div id="glyphs"></div>
        <button id="more" type="button" hidden></button>
      </section>

      <pre id="legal" hidden></pre>
    </main>
    <script src="theme.js"></script>
    <script src="font-parse.js"></script>
    <script src="fonts.js"></script>
  </body>
</html>
