# Holds every pull request to the registry's rules, including plugins added by hand, and runs
# the tests of the registry's own scripts and of every plugin.
#
# GitHub starts no workflow for a pull request the submission workflow opens with its own
# token, so submit.mjs starts this one on the submission's branch through workflow_dispatch.
# /approve merges only once this job, `check`, has passed on the commit it names. A ruleset
# on main that requires `check` holds a merge by hand to it too.
#
# A pull request's code runs here: plugins' tests, and their init.lua to read what it declares.
# So the job gets a read-only token, keeps no credentials in the checkout, and uses no secrets.
# The lint tools are pinned releases, checked against their SHA-256 before they run.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      STYLUA_URL: https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
      STYLUA_SHA256: bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab
      SELENE_URL: https://github.com/Kampfkarren/selene/releases/download/0.28.0/selene-0.28.0-linux.zip
      SELENE_SHA256: 5d8706751968486d46d120316b108154693052f75af60efb3dbf4d4cf9e4d902
      LUALS_URL: https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
      LUALS_SHA256: e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The whole history, so each entry of index.json can be checked against it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: The registry's rules
        run: node scripts/check.mjs
      - name: A pull request leaves index.json to the index workflow
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- index.json; then
            echo "This pull request changes index.json. The index workflow writes it after a merge, so leave it out."
            exit 1
          fi
      - name: Every entry in index.json names an approved commit
        run: node scripts/index.mjs --verify
      - name: The registry's scripts
        run: node --test "test/*.test.mjs"
      # The app's repository is private and this job has no secrets, so there is no app
      # checkout here: the contracts, and the tests that need the app's lib/, say they skip.
      - name: What each plugin declares, each plugin's tests, and the contracts
        run: node scripts/lua-test.mjs
      - name: Vendored files match their published sources
        run: node scripts/vendor.mjs verify
      - name: Install StyLua and selene
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o stylua.zip "$STYLUA_URL"
          echo "$STYLUA_SHA256  stylua.zip" | sha256sum -c -
          curl -fsSL -o selene.zip "$SELENE_URL"
          echo "$SELENE_SHA256  selene.zip" | sha256sum -c -
          unzip -o -q stylua.zip -d bin
          unzip -o -q selene.zip -d bin
          chmod +x bin/stylua bin/selene
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lua style
        run: stylua --check plugins profiles contracts
      - name: Lua lint
        run: |
          selene plugins profiles
          selene --config tests.selene.toml plugins/*/tests contracts
      - name: Install lua-language-server
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o luals.tar.gz "$LUALS_URL"
          echo "$LUALS_SHA256  luals.tar.gz" | sha256sum -c -
          mkdir -p luals
          tar -xzf luals.tar.gz -C luals
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - name: Lua types, against the app's types in types/
        run: node scripts/luals.mjs
      # Shader code from the Shader Builder's compiler and examples goes through real compilers:
      # glslangValidator for GLSL ES and naga for WGSL. Tests reach them through shader_check.
      - name: Cache naga
        id: naga
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-30.0.1-${{ runner.os }}
      - name: Install glslang and naga
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools
          if [ ! -x "$HOME/.cargo/bin/naga" ]; then
            cargo install naga-cli --version 30.0.1 --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Shaders compile
        env:
          SHADER_TOOLS: required
        run: node scripts/lua-test.mjs shader
