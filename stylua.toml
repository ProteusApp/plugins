# Two spaces, 80 columns, single quotes, and every block body on its own line.
column_width = 80
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferSingle"
call_parentheses = "Always"
collapse_simple_statement = "Never"
block_newline_gaps = "Preserve"
space_after_function_names = "Always"

[sort_requires]
enabled = true
